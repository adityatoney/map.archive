version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: medbed
      POSTGRES_PASSWORD: medbed
      POSTGRES_DB: medbed
    ports:
      - "${MAP_PORT_DB:-10510}:5432"
    volumes:
      - ${SSD_DATA}/map/postgres:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbed"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${MAP_PORT_REDIS:-10514}:6379"
    volumes:
      - ${SSD_DATA}/map/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/medbed_neo4j_pass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${MAP_PORT_NEO4J_HTTP:-10515}:7474"
      - "${MAP_PORT_NEO4J_BOLT:-10516}:7687"
    volumes:
      - ${SSD_DATA}/map/neo4j:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "${MAP_PORT_API:-10511}:8000"
    volumes:
      - ./api:/app
      - ${SSD_DATA}/map/uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/app
      - ${SSD_DATA}/map/uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info

  web:
    profiles: [prod]
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${MAP_PORT_WEB:-10513}:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - api
    command: npx next dev -p 3000

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "${MAP_PORT_ML:-10512}:8001"
    volumes:
      - ./ml:/app
      - ${SSD_DATA}/map/model-cache:/root/.cache/huggingface
    env_file:
      - .env
    profiles:
      - ml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: uvicorn serve.handler:app --host 0.0.0.0 --port 8001 --reload
